<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f0d">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>AI WeightLoss — похудение с ИИ</title>
  <meta name="description" content="AI-помощник для похудения: персональный рацион, отслеживание веса, поддержка ИИ. Прямо в Telegram.">
  <meta property="og:title" content="AI WeightLoss — похудение с ИИ">
  <meta property="og:description" content="Персональный план питания, отслеживание веса и поддержка ИИ. Бесплатно в Telegram.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="styles.css?v=23">
  <link rel="stylesheet" href="enhance.css?v=3">
  <script>
    window.addEventListener("unhandledrejection", function(e) {
      if (e.reason && (String(e.reason).includes("WebAppMethodUnsupported") || String(e.reason).includes("CloudStorage"))) {
        e.preventDefault();
        e.stopPropagation();
      }
    });
  </script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    // Override CloudStorage in non-Telegram environments to prevent errors
    (function() {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg && tg.CloudStorage && (!tg.initData || tg.initData.length === 0)) {
        tg.CloudStorage.getItem = function(key, cb) { if (cb) cb(new Error("unsupported"), null); };
        tg.CloudStorage.setItem = function(key, val, cb) { if (cb) cb(new Error("unsupported")); };
      }
    })();
  </script>
</head>
<body>
  <div id="app">
    <!-- 3D Background Canvas -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- Splash / welcome preview (cinematic, until user skips) -->
    <div id="splash" class="splash">
      <div class="splash__ray"></div>
      <div class="splash__ray splash__ray--2"></div>
      <div class="splash__particles" id="splash-particles"></div>
      <div class="splash__content">
        <div class="splash__logo">🥗</div>
        <h1 class="splash__title">AI <span class="grad">WeightLoss</span></h1>
        <p class="splash__subtitle">ПЕРСОНАЛЬНЫЙ РАЦИОН · ПОДДЕРЖКА ИИ</p>
        <div class="splash__status">Загрузка</div>
        <div class="splash__progress"><div class="splash__progress-fill"></div></div>
      </div>
      <button type="button" class="splash__skip" id="splash-skip" aria-label="Пропустить">Пропустить →</button>
    </div>

    <!-- Screens -->
    <div id="screen-agreement" class="screen active"></div>
    <div id="screen-login" class="screen"></div>
    <div id="screen-registration" class="screen"></div>
    <div id="screen-settings" class="screen"></div>
    <div id="screen-mealplan" class="screen"></div>
    <div id="screen-tracker" class="screen"></div>
    <div id="screen-chat" class="screen"></div>

    <!-- Support button (top-right, always visible) -->
    <button id="support-btn" class="support-btn" title="Поддержка">
      <span class="support-btn__icon">👤</span>
    </button>

    <!-- Feedback (review) floating badge -->
    <button type="button" id="review-btn" class="review-btn" title="Оставить отзыв" aria-label="Оставить отзыв" aria-hidden="true">
      <span>⭐</span> Оставить отзыв
    </button>

    <!-- Review sheet -->
    <div id="review-sheet" class="review-sheet hidden">
      <div class="review-sheet__backdrop" id="review-backdrop"></div>
      <div class="review-sheet__card animate-in">
        <button type="button" class="review-sheet__close" id="review-close" aria-label="Закрыть">✕</button>
        <div style="text-align:center; margin-bottom:12px;">
          <div style="font-size:2.2rem; margin-bottom:6px;">⭐</div>
          <h2>Ваш отзыв</h2>
          <p style="color:var(--muted); font-size:0.8rem;">Помогите нам стать лучше — это займёт 10 секунд</p>
        </div>
        <div class="review-stars" id="review-stars">
          <span data-star="1">⭐</span><span data-star="2">⭐</span><span data-star="3">⭐</span><span data-star="4">⭐</span><span data-star="5">⭐</span>
        </div>
        <textarea id="review-text" class="form-input" placeholder="Что понравилось? Что улучшить?" rows="3" style="font-size:0.85rem; resize:vertical; margin-bottom:12px;"></textarea>
        <button class="btn btn-primary btn-block" id="review-submit">📨 Отправить отзыв</button>
      </div>
    </div>

    <!-- Support / Ticket center -->
    <div id="support-sheet" class="support-sheet hidden">
      <div class="support-sheet__backdrop" id="support-backdrop"></div>
      <div class="support-sheet__card animate-in">
        <button type="button" class="support-sheet__close" id="support-close" aria-label="Закрыть">✕</button>
        <div style="text-align:center; margin-bottom:14px;">
          <div style="font-size:2.2rem; margin-bottom:6px;">🎫</div>
          <h2>Поддержка</h2>
          <p style="color:var(--muted); font-size:0.8rem;">Создайте тикет — менеджер ответит в боте</p>
        </div>

        <div class="ticket-tabs">
          <button class="ticket-tab active" data-tab="new">✍️ Новый тикет</button>
          <button class="ticket-tab" data-tab="my">📋 Мои тикеты <span id="ticket-count" class="ticket-badge">0</span></button>
        </div>

        <div id="ticket-tab-new" class="ticket-tab-content">
          <div class="form-group" style="margin-bottom:10px;">
            <label class="form-label" style="font-size:0.75rem;">Категория</label>
            <select id="ticket-category" class="form-input" style="font-size:0.85rem;">
              <option value="bug">🐛 Проблема / баг</option>
              <option value="question">❓ Вопрос по диете</option>
              <option value="payment">💳 Оплата / доступ</option>
              <option value="feature">💡 Предложение</option>
              <option value="other">📝 Другое</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom:10px;">
            <label class="form-label" style="font-size:0.75rem;">Тема</label>
            <input type="text" id="ticket-subject" class="form-input" placeholder="Кратко о проблеме" style="font-size:0.85rem;">
          </div>
          <div class="form-group" style="margin-bottom:12px;">
            <label class="form-label" style="font-size:0.75rem;">Сообщение</label>
            <textarea id="ticket-text" class="form-input" placeholder="Опишите подробно..." rows="3" style="font-size:0.85rem; resize:vertical;"></textarea>
          </div>
          <button class="btn btn-primary btn-block" id="ticket-submit">📨 Отправить тикет</button>
        </div>

        <div id="ticket-tab-my" class="ticket-tab-content hidden">
          <div id="ticket-list"></div>
          <button class="btn btn-ghost btn-block" id="ticket-open-bot" style="margin-top:10px;">🤖 Открыть бот для ответа</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Three.js (deferred, 3D background) -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Chart.js (deferred, weight chart) -->
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- App (deferred, runs after libs) -->
  <script defer src="app.js?v=29"></script>
  <script defer src="enhance.js?v=7"></script>
</body>
</html>
