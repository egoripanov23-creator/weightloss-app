<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI WeightLoss — похудение с ИИ</title>
  <meta name="description" content="AI-помощник для похудения: персональный рацион, отслеживание веса, поддержка ИИ. Прямо в Telegram.">
  <meta property="og:title" content="AI WeightLoss — похудение с ИИ">
  <meta property="og:description" content="Персональный план питания, отслеживание веса и поддержка ИИ. Бесплатно в Telegram.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=5">
  <script>
    window.addEventListener("unhandledrejection", function(e) {
      if (e.reason && (String(e.reason).includes("WebAppMethodUnsupported") || String(e.reason).includes("CloudStorage"))) {
        e.preventDefault();
        e.stopPropagation();
      }
    });
  </script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    // Override CloudStorage in non-Telegram environments to prevent errors
    (function() {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg && tg.CloudStorage && (!tg.initData || tg.initData.length === 0)) {
        tg.CloudStorage.getItem = function(key, cb) { if (cb) cb(new Error("unsupported"), null); };
        tg.CloudStorage.setItem = function(key, val, cb) { if (cb) cb(new Error("unsupported")); };
      }
    })();
  </script>
</head>
<body>
  <div id="app">
    <!-- 3D Background Canvas -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- Screens -->
    <div id="screen-agreement" class="screen active"></div>
    <div id="screen-registration" class="screen"></div>
    <div id="screen-settings" class="screen"></div>
    <div id="screen-mealplan" class="screen"></div>
    <div id="screen-tracker" class="screen"></div>
  </div>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- App -->
  <script src="app.js?v=5"></script>
</body>
</html>
